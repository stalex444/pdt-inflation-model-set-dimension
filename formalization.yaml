status:
  scope: >-
    Formalized, 13 compared theorems, hypotheses inline, in namespace
    ModelSetDimension: admissibility_criterion, kronecker_density_criterion,
    least_physical_dimension, hyperbolic_case, dimension_one_pisot_or_salem,
    finite_order_case, jordan_block_witnesses, sector_rings,
    compositum_lattice, compositum_dilations, quartic_model_set,
    salem_witness and modelSet_isMeyer. Each compared theorem is one
    declaration; Solution.lean proves each by one application of the theorem
    of the same name in namespace InflationDimension. NOT formalized: the
    least physical dimension when det A = 0; the reading of r_1(p) (defined
    by ranks over Q) as the number of Jordan blocks of size one, standard
    linear algebra not formalized here since Mathlib has no Jordan form; the
    least dimension under aperiodicity; regularity and pure-point
    diffraction of the model sets (Hof 1995; Schlottmann 2000, cited); the
    identification of the matrices of (9) with multiplication on the ring of
    integers of Q(rho, Q) (cited from PALOMAR-2026-10-21-000012) and of
    GramRho, GramQ and GramRho (x) GramQ with the trace forms (cited from
    PALOMAR-2026-09-02-000014); and everything in the application paragraph.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound] (BUILD.txt).

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Opus-class, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted design, proof drafting and error-loop iteration against
        lake build at the pinned toolchain and Mathlib. The statements and
        definitions were fixed first, with a design and a critique of it;
        the proof modules (Admissibility, Normal, Count, Hyperbolic, DimOne,
        Instances with the Compositum port, ModelSetQ, Meyer) were then
        developed in eight parallel agent sessions in one workflow (about 90
        module compilations in total; one further exploratory session
        compiled lemmas toward the general statement (3)), each proving its
        compared statements with the exact text of Challenge.lean; a further
        agent session assembled the package, generated Solution.lean,
        DefinitionAudit.lean and MATHLIB_DEFINITIONS.md, and checked every
        compared declaration (axiom audit, the registry's comparator run
        locally). The general statement (3) was then proved in three further
        sessions: two parallel sessions built JordanData (Jordan data from
        rational ranks, the largest power-bounded summand; 34 compilations)
        and Tilt (a single cyclotomic factor; 24 compilations), and one
        assembled FormulaA (lower and upper bounds, transport to primary
        components, the corollaries; about 25 compilations) and repackaged
        the compared set. Exploratory compilation at the pin preceded the
        proofs.
      cost:
        wall_time: "scoping and design 2026-10-20; proof modules and packaging 2026-10-20 to 2026-10-21"
        spend_usd: "subscription-based"
        hardware: "local machine, Apple silicon"
      prompting_notes: >-
        Statements fixed first, each with its intended Lean form and Mathlib
        route; a statement that could not be closed exactly
        was to be removed from the compared set, not weakened (none was).
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: >-
        Author-directed target selection, statement design and acceptance.
      cost:
