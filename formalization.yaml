  - id: "Registered entry PALOMAR-2026-10-21-000012 (stalex444/pdt-hermite-signature-compositum, commit 5aa870e98236ba240561b798265c629df8c2d031)"
    relationship: "builds-on"
    note: >-
      The author's entry on the degree-12 compositum L of Q(rho) and Q(Q).
      Its tower L = K3[Y]/(Y^4 - Y - 1), K3 = Q[X]/(X^3 - X - 1), and the
      circle-freeness of L (statement (17) there: no element other than +-1
      has a conjugate on the unit circle) are ported to this repository in
      InflationDimension/Compositum/Tower.lean and
      InflationDimension/Compositum/CircleFree.lean, statements unchanged,
      and used in the proof of compared statement (9). Its statement (8),
      that the rho^i Q^j are a Z-basis of O_L = Z[rho] (x) Z[Q], is cited
      here and not compared: with it, the matrices of (9) are multiplication
      on O_L in that basis.

  - id: "Registered entry PALOMAR-2026-09-02-000014 (stalex444/golden-family-trace-forms)"
    relationship: "builds-on"
    note: >-
      The Q-level inputs of the ported tower (the two polynomials and their
      basic facts) come from this entry through the companion's port; the
      irreducibility of x^3 - x - 1 and x^4 - x - 1 is taken here from
      Mathlib's Selmer theorem. Its statements (8), (9) and (19), that
      GramRho, GramQ and GramRho (x) GramQ are the Gram matrices of the
      trace forms in the power and tensor power bases, and (23), that
      Q(rho) (x) Q(Q) is a field, are cited for compared statements (10)
      and (11) and not compared.

  - id: "Registered entry PALOMAR-2026-09-04-000004 (stalex444/chiral-padovan-histories)"
    relationship: "other"
    note: >-
      The registered entry this one overlaps most. Its cubic_record_windows
      proves the Meyer property of the cubic record window by norm
      arguments, with no model-set definition; its
      quartic_record_obstruction shows that a window on the real expanding
      place of Z[Q], observed at the complex place, gives a set that is not
      uniformly discrete, and quartic_escaping_coordinate that the omitted
      coordinate at q' is unbounded along the units Q^-n. Keeping the
      dropped coordinate at q' gives the model set of the Q-invariant scheme
      whose window line is the expanding real place; it is a Delone set by
      compared statement (13), but it is not Q-admissible by (4), since every
      admissible Q-invariant scheme on Z^4 has H in E^s, the line of q'.
      Dropping that coordinate, unbounded along Q^-n, is what destroys
      uniform discreteness; (11) is the admissible scheme.

  - id: "Registered entries PALOMAR-2026-08-19-000006, PALOMAR-2026-10-18-000019 and PALOMAR-2026-09-01-000005 (version 2)"
    relationship: "other"
    note: >-
