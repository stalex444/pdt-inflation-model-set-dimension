alignment:
  namespace: "ModelSetDimension"
  statements:
    - source: "Masakova-Mazac-Pelantova 2021, Prop. 13.2, Cor. 13.4 (necessity, diagonalizable maps); proved here for every integer matrix"
      lean: "ModelSetDimension.admissibility_criterion"
      module: "Solution"
      status: "proved"
      note: "Admissible iff power-bounded on H; the orbit window; the per-window criterion; U(A) <= dim E. Proved by InflationDimension.admissibility_criterion."
    - source: "Kronecker's density theorem; cut-and-project form Pleasants 2000, Cor. 2.12, and Masakova-Mazac-Pelantova Prop. 3.3(iii)"
      lean: "ModelSetDimension.kronecker_density_criterion"
      module: "Solution"
      status: "proved"
      note: "Density of the projected lattice iff no nonzero integral functional vanishes on E. Proved by InflationDimension.kronecker_density_criterion."
    - source: "this work (for squarefree chi_A the count also follows from the arguments of Masakova-Mazac-Pelantova Lemma 5.1, Prop. 8.1(iii), Cor. 13.4, stated there for generic schemes); Kronecker 1857 via Mathlib for the circle factors"
      lean: "ModelSetDimension.least_physical_dimension"
      module: "Solution"
      status: "proved"
      note: "det A != 0, any chi_A: (a) d(A) = dimensionFormula A, the sum over the distinct rational factors p of m_p u_p + c_p (m_p - r_1(p)) plus min(deg p, 2) for a circle factor with r_1(p) = m_p; (b) invariance under rational similarity; (c) circle factors cyclotomic; (d) for squarefree chi_A the normal form, the characterization and d(A) = U(A) + circleCount(A). Proved by InflationDimension.least_physical_dimension."
    - source: "inclusion-notion analogue of Harriss-Koivusalo-Walton Thm 3.3 (preprint); contains the necessity half of Masakova-Mazac-Pelantova Cor. 13.4 without diagonalizability"
      lean: "ModelSetDimension.hyperbolic_case"
      module: "Solution"
      status: "proved"
      note: "Admissible iff E contains E^u iff H lies in E^s; an invariant splitting carries an admissible scheme iff E contains E^u; d(A) = U(A), attained only by (E^u, E^s). Proved by InflationDimension.hyperbolic_case."
    - source: "Meyer 1972; Meyer 1995, Thm 6 (lattice-first model-set form); for Meyer sets also Lagarias 1999, Thm 4.1; Salem case Solomyak 2020, Section 4(iv), credited to Akiyama"
      lean: "ModelSetDimension.dimension_one_pisot_or_salem"
      module: "Solution"
      status: "proved"
      note: "det A != 0, any chi_A: d(A) = 1 iff chi_A irreducible with one root of modulus > 1, or A = +-1 (any rank); the root is real and the line is its eigenline. Proved by InflationDimension.dimension_one_pisot_or_salem."
    - source: "classical planar cyclotomic model sets (Huck; Baake-Grimm 2013, Section 7.3)"
      lean: "ModelSetDimension.finite_order_case"
      module: "Solution"
      status: "proved"
      note: "A^k = 1: cyclotomic factors, d = sum of min(deg p, 2) over the distinct factors; the same for squarefree chi_A on the circle; chi_A = Phi_n, n >= 3, gives d = 2. Proved by InflationDimension.finite_order_case."
    - source: "this work (examples)"
      lean: "ModelSetDimension.jordan_block_witnesses"
      module: "Solution"
      status: "proved"
      note: "I_2 and J_2: chi = (x - 1)^2, squarefree count 2 (x - 1 counted twice), d = 1 and 2; 1 + J_2(1) and 1 + J_3(1): d = 2 and 3. Proved by InflationDimension.jordan_block_witnesses."
    - source: "instances of (4)"
      lean: "ModelSetDimension.sector_rings"
      module: "Solution"
      status: "proved"
      note: "rho, rho^-1, Q, theta on Z[rho], Z[Q]: characteristic polynomials, hyperbolic, d = 1, 2, 3, 1; the expanding eigenvalue of theta in (1.3802, 1.3803). Proved by InflationDimension.sector_rings."
    - source: "instances of (4); circle-freeness ported from the author's registered entry PALOMAR-2026-10-21-000012 (stalex444/pdt-hermite-signature-compositum@5aa870e98236ba240561b798265c629df8c2d031)"
      lean: "ModelSetDimension.compositum_lattice"
      module: "Solution"
      status: "proved"
      note: "Every mulMatrix a, a != 0, +-e_00, is nonsingular (det != 0) and hyperbolic with d = U; rho, theta, rho Q, Q give 4, 3, 5, 9. Proved by InflationDimension.compositum_lattice."
    - source: "this work"
      lean: "ModelSetDimension.compositum_dilations"
      module: "Solution"
      status: "proved"
      note: "rho and theta act on E^u as real scalars; the spectral projection carries the quartic (cubic) sector onto E^u with the pairing of GramQ (GramRho) exactly; types (3,1), (2,1). Proved by InflationDimension.compositum_dilations."
    - source: "in substance an instance of Masakova-Mazac-Pelantova Thm 13.1 and Harriss-Koivusalo-Walton Section 3.4; compare Kalle-Steiner 2012, Lemma 4.3; not new"
      lean: "ModelSetDimension.quartic_model_set"
      module: "Solution"
      status: "proved"
      note: "The scheme (E^u, E^s) of Q on Z^4, the interval window, the Q-invariant model set, det -1/q', the non-real moduli, the types (2,1) and (1,0). Proved by InflationDimension.quartic_model_set."
    - source: "an instance of Solomyak 2020, Section 4(iv), credited to Akiyama"
      lean: "ModelSetDimension.salem_witness"
      module: "Solution"
      status: "proved"
      note: "The companion of x^4 - x^3 - x^2 - x + 1: not hyperbolic, d = 1, Salem root in (1.7220, 1.7221), unique eigenline. Proved by InflationDimension.salem_witness."
    - source: "classical (Meyer 1972; Moody 1997)"
      lean: "ModelSetDimension.modelSet_isMeyer"
      module: "Solution"
      status: "proved"
      note: "Every model set is a Delone.DeloneSet in E with uniformly discrete difference set. Proved by InflationDimension.modelSet_isMeyer."

