    type: "preprint"
    location: "https://arxiv.org/abs/2512.13659"
    relationship: "other"
    note: >-
      Preprint, not refereed. Thm 3.3: for patterns that are substitutional
      up to mutual local derivability with expansive inflation, the internal
      space is the contracting subspace of a hyperbolic lattice automorphism.
      Compared statement (4) is the analogue for the inclusion notion
      A Lambda(W) contained in Lambda(W), a different notion; density is
      proved here and assumed there. Section 3.4 (codimension-one schemes
      with interval windows) covers the scheme of (11) in substance.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Designer quasicrystals: cut-and-project sets with pre-assigned properties"
    authors:
      - "P. A. B. Pleasants"
    id: "Directions in Mathematical Quasicrystals, CRM Monograph Series 13, American Mathematical Society (2000), 95-141"
    # Crossref-verified 2026-10-21: DOI 10.1090/crmm/013/04, pages 95-141 (the Crossref record
