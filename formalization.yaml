  - title: "On generalized self-similarities of cut-and-project sets"
    authors:
      - "Zuzana Masakova"
      - "Jan Mazac"
      - "Edita Pelantova"
    id: "Linear Algebra and its Applications 625 (2021), 279-321; arXiv:1909.10753"
    # Crossref-verified 2026-10-21: DOI 10.1016/j.laa.2021.05.010 (three authors, LAA 625,
    # 279-321, 2021-09). arXiv:1909.10753v2 (2020-01-30) is the latest version and the text
    # read; theorem numbers below are those of arXiv v2 (the journal numbering was not checked).
    type: "article"
    location: "https://doi.org/10.1016/j.laa.2021.05.010"
    relationship: "independently-proves"
    note: >-
      Scoped to schemes on a fixed integer lattice (integer-lifted schemes).
      For diagonalizable maps and generic (non-degenerate, aperiodic,
      irreducible) schemes, physical map first: Prop. 13.2 and Cor. 13.4
      (spectral radius of the internal map at most 1) are the necessity half
      of compared statement (1), which is proved here for every integer
      matrix with no diagonalizability hypothesis, and they give the
      necessity of H in E^s in (4); Lemma 5.1 (whose relevant half uses only
      non-degeneracy) is the lower-bound part of (3)(b); Prop. 3.3(iii) and
      Prop. 8.1(iii) are the cut-and-project form of (2). For squarefree
      chi_A, hence diagonalizable A, the count of (3) follows from Lemma
      5.1, Prop. 8.1(iii) and Cor. 13.4. Thm 13.7, the minimal lattice rank
      for a given physical map (unit circle allowed; diagonalizable maps,
      generic schemes), is the physical-map-first dual of (3), cited and not
      re-proved. The scheme of (11) is in substance an instance of Thm 13.1.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "When is a cut and project set substitutional?"
    authors:
      - "Edmund Harriss"
      - "Henna Koivusalo"
      - "James J. Walton"
    id: "arXiv:2512.13659 (v1, 2025-12-15; preprint)"
