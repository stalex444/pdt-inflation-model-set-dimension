    type: "incollection"
    location: "https://doi.org/10.1007/978-3-662-03130-8_1"
    relationship: "independently-proves"
    note: >-
      Thm 6: if a Meyer set is mapped into itself by multiplication by
      beta > 1 then beta is a Pisot or Salem number; conversely every Pisot
      or Salem number is the inflation factor of a model set. Compared
      statement (5) proves the lattice-first, model-set form: for
      A-invariant schemes with det A != 0 and chi_A squarefree, d(A) = 1 iff
      chi_A is irreducible with exactly one root of modulus > 1 (or A = +-1
      on Z^1), that root real; it does
      not prove the theorem for arbitrary Meyer sets. The dichotomy goes
      back to Meyer, Algebraic Numbers and Harmonic Analysis, North-Holland
      Mathematical Library 2 (1972).
