status:
  scope: >-
    Formalized, 13 compared theorems, hypotheses inline, in namespace
    ModelSetDimension: admissibility_criterion, kronecker_density_criterion,
    least_physical_dimension_squarefree, hyperbolic_case,
    dimension_one_pisot_or_salem, finite_order_case,
    squarefree_hypothesis_needed, sector_rings, compositum_lattice,
    compositum_dilations, quartic_model_set, salem_witness and
    modelSet_isMeyer. Each compared theorem is one declaration; Solution.lean
    proves each by one application of the theorem of the same name in
    namespace InflationDimension. NOT formalized: the least physical
    dimension when chi_A is not squarefree and has eigenvalues on the unit
    circle (Jordan blocks on the circle); the least dimension under
    aperiodicity; regularity and pure-point diffraction of the model sets
    (Hof 1995; Schlottmann 2000, cited); the identification of the matrices
    of (9) with multiplication on the ring of integers of Q(rho, Q) (cited
    from PALOMAR-2026-10-21-000012) and of GramRho, GramQ and
    GramRho (x) GramQ with the trace forms (cited from
    PALOMAR-2026-09-02-000014); and
    everything in the application paragraph.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound] (BUILD.txt).

