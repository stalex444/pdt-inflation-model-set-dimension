fidelity:
  divergences: >-
    (i) The lattice is the integer lattice Z^iota of R^iota for a finite
    type iota (the Z-span of the standard basis), and the map an integer
    matrix acting by Matrix.toLin'; an arbitrary lattice with an
    automorphism is reduced to this case by a choice of basis. (ii) The
    scheme notion: A-invariant complementary subspaces E, H with Z^iota
    meeting H only in 0 and the projection of Z^iota to H dense in H;
    aperiodicity is not required and H = 0 is allowed. A window is a
    bounded subset of H containing a relative ball of H (not necessarily
    compact or regular), and admissibility is the existence of a window with
    A Lambda(W) contained in Lambda(W). (iii) Norms are the sup norm on
    R^iota. (iv) E^u is defined dynamically (vectors with a backward orbit
    tending to 0), E^s as the vectors whose forward orbit tends to 0; U(A)
    counts the complex roots of chi_A of modulus > 1 with multiplicity. (v)
    circleCount is defined through Mathlib's normalizedFactors of chi_A over
    Q. (vi) Statement (5) is in root-count form, with no Pisot or Salem
    predicate. (vii) Statement (6)'s planar clause is stated for every
    integer matrix with chi_A = Phi_n over Z. (viii) Statements (8)-(11) are
    about explicit integer matrices (companion matrices, Kronecker products
    of their powers) and explicit integer Gram matrices; (9) quantifies over
    the coefficient vectors a other than 0 and +-e_00, i.e. alpha other
    than 0, +-1. (ix) In (10) the spectral projection is stated as the
    existence of a linear map onto E^u that fixes E^u and kills E^s, and the
    pairings are those of the Gram matrices. (x) In (11) the window is a
    specific subset of E^s, shown to be a segment, and the trace form is the
    quadratic form of GramQ restricted to E and H. (xi) In (13) the Delone
    set lives in E with the metric of the sup norm restricted to E. (xii)
    The compared statements use definitions of this entry, stated in
    Challenge.lean itself between the lines -- BEGIN SHARED DEFINITIONS and
    -- END SHARED DEFINITIONS; that text is byte for byte the body of
    InflationDimension/Defs.lean, on which the proof modules are built.
    Challenge.lean imports Mathlib only and says so in its opening
    docstring.

