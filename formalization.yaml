sources:
  - title: "On generalized self-similarities of cut-and-project sets"
    authors:
      - "Zuzana Masakova"
      - "Jan Mazac"
      - "Edita Pelantova"
    id: "Linear Algebra and its Applications 625 (2021), 279-321; arXiv:1909.10753"
    # Crossref-verified 2026-10-21: DOI 10.1016/j.laa.2021.05.010 (three authors, LAA 625,
    # 279-321, 2021-09). arXiv:1909.10753v2 (2020-01-30) is the latest version and the text
    # read; theorem numbers below are those of arXiv v2 (the journal numbering was not checked).
    type: "article"
    location: "https://doi.org/10.1016/j.laa.2021.05.010"
    relationship: "independently-proves"
    note: >-
      Scoped to schemes on a fixed integer lattice (integer-lifted schemes).
      For diagonalizable maps and generic (non-degenerate, aperiodic,
      irreducible) schemes, physical map first: Prop. 13.2 and Cor. 13.4
      (spectral radius of the internal map at most 1) are the necessity half
      of compared statement (1), which is proved here for every integer
      matrix with no diagonalizability hypothesis, and they give the
      necessity of H in E^s in (4); Lemma 5.1 (whose relevant half uses only
      non-degeneracy) is the lower-bound part of the squarefree
      characterization in (3)(d); Prop. 3.3(iii) and Prop. 8.1(iii) are the
      cut-and-project form of (2). For squarefree chi_A, hence
      diagonalizable A, the count of (3) also follows from the arguments of
      Lemma 5.1, Prop. 8.1(iii) and Cor. 13.4, which are stated for generic
      (aperiodic) schemes, under which a factor x +- 1, Phi_3, Phi_4 or
      Phi_6 admits no scheme. Thm 13.7, the minimal lattice rank for a given
      physical map (unit circle allowed; diagonalizable maps, generic
      schemes), is the physical-map-first dual of (3), cited and not
      re-proved. The scheme of (11) is in substance an instance of Thm 13.1.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "When is a cut and project set substitutional?"
    authors:
      - "Edmund Harriss"
      - "Henna Koivusalo"
      - "James J. Walton"
    id: "arXiv:2512.13659 (v1, 2025-12-15; preprint)"
    # arXiv metadata checked 2026-10-21: v1 only, no journal reference.
    type: "preprint"
    location: "https://arxiv.org/abs/2512.13659"
    relationship: "other"
    note: >-
      Preprint, not refereed. Thm 3.3: for patterns that are substitutional
      up to mutual local derivability with expansive inflation, the internal
      space is the contracting subspace of a hyperbolic lattice automorphism.
      Compared statement (4) is the analogue for the inclusion notion
      A Lambda(W) contained in Lambda(W), a different notion; density is
      proved here and assumed there. Section 3.4 (codimension-one schemes
      with interval windows) covers the scheme of (11) in substance.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Designer quasicrystals: cut-and-project sets with pre-assigned properties"
    authors:
      - "P. A. B. Pleasants"
    id: "Directions in Mathematical Quasicrystals, CRM Monograph Series 13, American Mathematical Society (2000), 95-141"
    # Crossref-verified 2026-10-21: DOI 10.1090/crmm/013/04, pages 95-141 (the Crossref record
    # has no author field; the author is as cited by Masakova-Mazac-Pelantova). Primary not
    # opened; Cor. 2.12 as stated in Masakova-Mazac-Pelantova Prop. 3.3.
    type: "incollection"
    location: "https://doi.org/10.1090/crmm/013/04"
    relationship: "independently-proves"
    note: >-
      Cor. 2.12: the projection of the lattice to the internal space is
      dense iff the physical space lies in no hyperplane spanned by lattice
      vectors, the cut-and-project form of Kronecker's classical density
      theorem. Compared statement (2), in the equivalent form: every real
      functional that is integer-valued on Z^iota and vanishes on E is zero.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Quasicrystals, Diophantine approximation and algebraic numbers"
    authors:
      - "Yves Meyer"
    id: "Beyond Quasicrystals (Les Houches, 1994), Springer (1995), 3-16"
    # Crossref-verified 2026-10-21: DOI 10.1007/978-3-662-03130-8_1. Thm 6 read through
    # Berthe-Yassawi, arXiv:2404.04116, Thm 2.2.
    type: "incollection"
    location: "https://doi.org/10.1007/978-3-662-03130-8_1"
    relationship: "independently-proves"
    note: >-
      Thm 6: if a Meyer set is mapped into itself by multiplication by beta
      > 1 then beta is a Pisot or Salem number; conversely every Pisot or
      Salem number is the inflation factor of a model set. Compared
      statement (5) proves the lattice-first, model-set form: for
      A-invariant schemes with det A != 0 and any chi_A, d(A) = 1 iff chi_A
      is irreducible with exactly one root of modulus > 1 (or A = +-1), that
      root real; it does not prove the theorem for arbitrary Meyer sets. The
      dichotomy goes back to Meyer, Algebraic Numbers and Harmonic Analysis,
      North-Holland Mathematical Library 2 (1972); for Meyer sets in general
      it is also Lagarias 1999, Thm 4.1 (listed below).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Geometric Models for Quasicrystals I. Delone Sets of Finite Type"
    authors:
      - "J. C. Lagarias"
    id: "Discrete and Computational Geometry 21 (1999), 161-191"
    # Crossref-verified 2026-10-21: DOI 10.1007/PL00009413 (J. C. Lagarias, DCG 21(2), 161-191,
    # 1999-02). Primary not opened; the theorem is as stated in Solomyak 2020, Thm 3(iii)
    # (attributed there to Lagarias 1999 and Meyer 1972), numbered Thm 4.1 by
    # Masakova-Mazac-Pelantova, Section 14.
    type: "article"
    location: "https://doi.org/10.1007/PL00009413"
    relationship: "background"
    note: >-
      Thm 4.1: if a Meyer set X in R^d satisfies eta X contained in X for a
      real eta > 1, then eta is a Pisot or Salem number. With Meyer 1972, the
      necessity half of the Pisot-or-Salem dichotomy for Meyer sets; compared
      statement (5) proves only its lattice-first, model-set form.
    license: "unknown"
    author_endorsement: "n/a"
